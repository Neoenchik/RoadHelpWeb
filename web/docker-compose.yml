services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadhelp}
      POSTGRES_USER: ${POSTGRES_USER:-road}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-road}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-road} -d ${POSTGRES_DB:-roadhelp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/roadhelp &&
      mc anonymous set download local/roadhelp/avatars &&
      exit 0
      "

  api:
    build:
      context: ./apps
      dockerfile: RoadHelp.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-roadhelp};Username=${POSTGRES_USER:-road};Password=${POSTGRES_PASSWORD:-road}
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=${JWT__Secret:-dev_secret_change_in_production_12345678901234567890}
      - Jwt__Issuer=${JWT__Issuer:-RoadHelp}
      - Jwt__Audience=${JWT__Audience:-RoadHelpFront}
      - BotConfig__Secret=${BOT_SECRET:-super_secret_bot_key_dev}
      - App__BaseUrl=${APP__BaseUrl:-http://localhost:3000}
      - OTP_DEV_CODE=${OTP_DEV_CODE:-1234}
      - AWS__ServiceURL=http://minio:9000
      - AWS__Profile=default
      - AWS__Region=eu-central-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost:8080}
      - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next_cache:/workspace/apps/web/.next

  bot:
    build:
      context: ../project
      dockerfile: Dockerfile
    environment:
      - API_URL=http://api:8080
      - REDIS_URL=redis://redis:6379
      - BOT_TOKEN=${BOT_TOKEN:-placeholder_set_in_env}
      - BOT_SECRET=${BOT_SECRET:-super_secret_bot_key_dev}
      - ADMIN_IDS=${ADMIN_IDS:-}
      - CANCEL_RATE_THRESHOLD=0.20
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  web_node_modules:
  web_next_cache:
