# Production overlay: Next.js build + limits simulating VPS 2 vCPU / 2 GB RAM / ~20 GB disk.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Total memory limits ≈ 1.85 GB (headroom for Docker/OS on a 2 GB VPS).
# Bot disabled by default — enable with: --profile bot

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 384M
        reservations:
          memory: 128M

  redis:
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          memory: 32M

  minio:
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          memory: 64M

  minio-init:
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_GCHeapHardLimit=20000000
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 512M
        reservations:
          memory: 192M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
    volumes: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 128M

  bot:
    profiles: [bot]
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 96M
        reservations:
          memory: 48M
